        - "easy to confuse with another label on the surface: a reminder that quotes the full original invoice, a paid copy of an invoice, a statement of account, a quotation or order confirmation or pro forma with line items and a total, a payment dispute that cites invoice numbers, a phishing message styled as a known vendor from a lookalike domain or asking to change bank details"
